<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LLD Alerts</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0b0f1a">
<style>
:root{color-scheme:dark}body{margin:0;background:#0b0f1a;color:#f1f5f9;font:16px/1.5 system-ui,-apple-system,sans-serif;padding:24px 16px}
.w{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:14px}h1{font-size:22px;margin:0}p{margin:0;color:#94a3b8;font-size:14px}
button,input{font:inherit;border-radius:12px;border:1px solid #273049;padding:14px;background:#151b2b;color:#f1f5f9}button{font-weight:800;background:#2563eb;border-color:#2563eb}button.g{background:#151b2b;border-color:#273049}
#st{padding:12px 14px;border-radius:12px;background:#151b2b;border:1px solid #273049;font-size:14px}
</style></head><body><div class="w">
<h1>LLD Alerts</h1>
<p>Get a notification on this phone when a trade offer or a completed trade happens in LLD Dynasty.</p>
<div id="st">Checking…</div>
<button id="on">Enable notifications</button>
<p>iPhone: tap Share, then Add to Home Screen, and open this page from the new icon first. Notifications only work from there.</p>
<input id="k" type="password" placeholder="Admin key (for the test button)" autocomplete="off">
<button id="t" class="g">Send a test notification</button>
</div>
<script>
const WORKER_URL = 'https://lld-alerts.y9d7rsw57p.workers.dev/'; // like https://lld-alerts.yourname.workers.dev
const WORKER = WORKER_URL.trim().replace(/\/+$/, '');
const $ = id => document.getElementById(id), st = m => { $('st').textContent = m; };
const u8 = s => { const p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...b].map(c => c.charCodeAt(0))); };
try { $('k').value = localStorage.getItem('lld_ak') || ''; } catch (e) { }
async function status() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) { st('This browser cannot do push. On iPhone, add this page to the Home Screen first and open it from there.'); return; }
    const r = await navigator.serviceWorker.getRegistration(), s = r && await r.pushManager.getSubscription();
    st(s ? 'Notifications are ON for this device.' : 'Notifications are off.');
}
$('on').onclick = async () => {
    try {
        if (WORKER.indexOf('PASTE') === 0) { st('Set the WORKER line at the top of index.html first.'); return; }
        const reg = await navigator.serviceWorker.register('sw.js?w=' + encodeURIComponent(WORKER)); await navigator.serviceWorker.ready;
        if ((await Notification.requestPermission()) !== 'granted') { st('Permission was not granted. Allow notifications in your phone settings for this page.'); return; }
        const vr = await fetch(WORKER + '/vapid'); let vj = null; try { vj = await vr.json(); } catch (e) { }
        if (!vj || !vj.key) { st('The Worker did not return a key (status ' + vr.status + '). Open ' + WORKER + '/vapid in your browser to see why. Most often the STATE storage binding is missing or the Worker address is wrong.'); return; }
        const key = vj.key;
        let sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: u8(key) });
        await fetch(WORKER + '/subscribe', { method: 'POST', body: JSON.stringify(sub.toJSON()) });
        st('Notifications are ON for this device.');
    } catch (e) { st('Could not turn on: ' + e.message); }
};
$('t').onclick = async () => {
    try { const k = $('k').value.trim(); localStorage.setItem('lld_ak', k); const r = await (await fetch(WORKER + '/test?k=' + encodeURIComponent(k))).json(); st(r.error ? 'Wrong admin key.' : 'Test sent to ' + r.sent + ' device(s).'); } catch (e) { st('Test failed: ' + e.message); }
};
status();
</script></body></html>
